<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiS Daily News</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            color: #eee;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid #0f0;
        }
        h1 {
            margin: 0;
            color: #0f0;
            font-size: 2.2em;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .article {
            background: #1a1a1a;
            margin-bottom: 25px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .article img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .content {
            padding: 18px;
        }
        .title {
            font-size: 1.35em;
            margin: 0 0 12px 0;
            line-height: 1.3;
            color: #0f0;
        }
        .summary {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .read-more {
            color: #0f0;
            text-decoration: none;
            font-weight: bold;
        }
        .coffee {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #FFDD00;
            color: #000;
            padding: 14px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <h1>📰 AiS Daily News</h1>
        <p>Fresh headlines from around the world • Updated automatically</p>
    </header>

    <div class="container" id="news-container">
        <div class="loading">Loading latest news...</div>
    </div>

    <a href="https://www.buymeacoffee.com/ais123" target="_blank" class="coffee">☕ Support AiS</a>

    <script>
        async function loadNews() {
            const feeds = [
                "https://feeds.bbci.co.uk/news/rss.xml",
                "https://rss.nytimes.com/services/xml/rss/nyt/World.xml",
                "https://techcrunch.com/feed/",
                "https://rss.reuters.com/rss/worldNews"
            ];

            let allHtml = '';

            for (let url of feeds) {
                try {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                    const data = await res.json();

                    if (data.items) {
                        data.items.slice(0, 6).forEach(item => {
                            const image = item.enclosure ? item.enclosure.link : 
                                         (item.thumbnail ? item.thumbnail : 'https://via.placeholder.com/600x300/1a1a1a/0f0?text=News');
                            allHtml += `
                                <div class="article">
                                    <img src="\( {image}" alt=" \){item.title}">
                                    <div class="content">
                                        <h2 class="title">${item.title}</h2>
                                        <p class="summary">${item.description ? item.description.replace(/<[^>]+>/g, '').substring(0, 160) + '...' : 'Read more on the original site.'}</p>
                                        <a href="${item.link}" target="_blank" class="read-more">Read Full Article →</a>
                                    </div>
                                </div>`;
                        });
                    }
                } catch(e) {}
            }

            document.getElementById('news-container').innerHTML = allHtml || '<p style="text-align:center; padding:40px;">Unable to load news right now. Please check your connection.</p>';
        }

        // Load news when page opens
        loadNews();
    </script>
</body>
</html>
