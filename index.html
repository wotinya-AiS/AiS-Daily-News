<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiS Daily News</title>
    <style>
        body { margin:0; padding:0; background:#0f0f0f; color:#eee; font-family:'Segoe UI',Arial,sans-serif; }
        header { background:#111; padding:25px; text-align:center; border-bottom:5px solid #0f0; }
        h1 { color:#0f0; font-size:2.5em; margin:0; }
        .subtitle { color:#aaa; margin-top:8px; }
        .container { max-width:1000px; margin:0 auto; padding:20px; }
        .article { background:#1a1a1a; margin-bottom:25px; border-radius:12px; overflow:hidden; border:1px solid #333; }
        .article img { width:100%; height:230px; object-fit:cover; }
        .content { padding:20px; }
        .title { font-size:1.4em; margin-bottom:12px; color:#0f0; line-height:1.3; }
        .summary { color:#ccc; line-height:1.6; margin-bottom:15px; }
        .read-more { color:#0f0; text-decoration:none; font-weight:bold; }
        .coffee { position:fixed; bottom:25px; right:25px; background:#FFDD00; color:#000; padding:15px 25px; border-radius:50px; text-decoration:none; font-weight:bold; box-shadow:0 5px 15px rgba(0,0,0,0.5); z-index:100; }
        .loading { text-align:center; padding:60px; color:#888; font-size:1.1em; }
    </style>
</head>
<body>
    <header>
        <h1>📰 AiS Daily News</h1>
        <p class="subtitle">Fresh headlines from around the world • Updated automatically on every refresh</p>
    </header>

    <div class="container" id="news-container">
        <div class="loading">Loading latest news...</div>
    </div>

    <a href="https://www.buymeacoffee.com/ais123" target="_blank" class="coffee">☕ Support AiS</a>

    <script>
        async function loadNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '<div class="loading">Loading latest news from multiple sources...</div>';

            const feeds = [
                "https://feeds.bbci.co.uk/news/rss.xml",
                "https://rss.nytimes.com/services/xml/rss/nyt/World.xml",
                "https://techcrunch.com/feed/"
            ];

            let html = '';

            for (let url of feeds) {
                try {
                    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&count=8`);
                    const data = await res.json();

                    if (data.items && data.items.length > 0) {
                        data.items.slice(0, 5).forEach((item, index) => {
                            const img = item.enclosure?.link || item.thumbnail || `https://picsum.photos/800/400?random=${Date.now() + index}`;
                            html += `
                                <div class="article">
                                    <img src="\( {img}" alt=" \){item.title}">
                                    <div class="content">
                                        <h2 class="title">${item.title}</h2>
                                        <p class="summary">${(item.description || 'Read the full story on the original website.').replace(/<[^>]+>/g, '').substring(0, 165)}...</p>
                                        <a href="${item.link}" target="_blank" class="read-more">Read Full Article →</a>
                                    </div>
                                </div>`;
                        });
                    }
                } catch(e) {}
            }

            if (html) {
                container.innerHTML = html;
            } else {
                container.innerHTML = `<div class="loading">News is temporarily unavailable.<br>Please refresh the page again.</div>`;
            }
        }

        // Load fresh news every time the page loads/refreshes
        loadNews();
    </script>
</body>
</html>
