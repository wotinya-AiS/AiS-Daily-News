<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wycliffe Otinya Daily Motivation</title>
    <style>
        body { 
            margin:0; padding:0; background:#0a0a0a; color:#eee; 
            font-family:'Segoe UI',Arial,sans-serif; 
            min-height:100vh; display:flex; align-items:center; justify-content:center;
        }
        .card {
            background: linear-gradient(135deg, #1a1a1a, #111);
            max-width: 720px;
            margin: 20px;
            padding: 40px 30px;
            border-radius: 20px;
            border: 2px solid #0f0;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,255,0,0.3);
        }
        .quote {
            font-size: 1.45em;
            line-height: 1.5;
            margin-bottom: 25px;
            font-style: italic;
        }
        .author {
            color: #0f0;
            font-size: 1.3em;
            margin-bottom: 30px;
        }
        img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px 0;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
        }
        .coffee {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #FFDD00;
            color: #000;
            padding: 14px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✨ Wycliffe Otinya Daily Motivation</h1>
        <p style="color:#aaa; margin:15px 0 20px;">New inspiration every refresh</p>
        
        <div id="quote-container"></div>
        
        <button onclick="newQuote()">🔄 New Quote</button>
    </div>

    <a href="https://www.buymeacoffee.com/ais123" target="_blank" class="coffee">☕ Support Wycliffe Otinya</a>

    <script>
        const quotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs", img: "https://picsum.photos/id/1015/800/400" },
            { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill", img: "https://picsum.photos/id/1016/800/400" },
            { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson", img: "https://picsum.photos/id/133/800/400" },
            { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt", img: "https://picsum.photos/id/201/800/400" },
            { text: "Everything you’ve ever wanted is sitting on the other side of fear.", author: "George Addair", img: "https://picsum.photos/id/180/800/400" },
            { text: "The only impossible journey is the one you never begin.", author: "Tony Robbins", img: "https://picsum.photos/id/107/800/400" },
            { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt", img: "https://picsum.photos/id/1018/800/400" },
            { text: "Your only limit is the one you set yourself.", author: "Unknown", img: "https://picsum.photos/id/133/800/400" },
            { text: "Small steps every day lead to big results.", author: "Unknown", img: "https://picsum.photos/id/201/800/400" },
            { text: "The harder you work for something, the greater you'll feel when you achieve it.", author: "Unknown", img: "https://picsum.photos/id/180/800/400" },
            { text: "Turn your wounds into wisdom.", author: "Oprah Winfrey", img: "https://picsum.photos/id/1015/800/400" },
            { text: "Discipline is choosing between what you want now and what you want most.", author: "Unknown", img: "https://picsum.photos/id/1074/800/400" },
            { text: "The best way to predict the future is to create it.", author: "Abraham Lincoln", img: "https://picsum.photos/id/133/800/400" },
            { text: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis", img: "https://picsum.photos/id/201/800/400" },
            { text: "It always seems impossible until it is done.", author: "Nelson Mandela", img: "https://picsum.photos/id/180/800/400" },
            { text: "Fall seven times and stand up eight.", author: "Japanese Proverb", img: "https://picsum.photos/id/107/800/400" },
            { text: "The only person you are destined to become is the person you decide to be.", author: "Ralph Waldo Emerson", img: "https://picsum.photos/id/1015/800/400" },
            { text: "Everything comes to him who hustles while he waits.", author: "Thomas Edison", img: "https://picsum.photos/id/133/800/400" },
            { text: "The man who moves a mountain begins by carrying away small stones.", author: "Confucius", img: "https://picsum.photos/id/201/800/400" },
            { text: "Don't let yesterday take up too much of today.", author: "Will Rogers", img: "https://picsum.photos/id/180/800/400" },
            { text: "The only limit to our realization of tomorrow will be our doubts of today.", author: "Franklin D. Roosevelt", img: "https://picsum.photos/id/1016/800/400" }
        ];

        function newQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const q = quotes[randomIndex];
            const container = document.getElementById('quote-container');
            
            container.innerHTML = `
                <img src="${q.img}" alt="Motivation">
                <p class="quote">"${q.text}"</p>
                <p class="author">— ${q.author}</p>
            `;
        }

        // Load first quote
        newQuote();
    </script>
</body>
</html>
