<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiS Daily News</title>
    <style>
        body { margin:0; padding:0; background:#0f0f0f; color:#eee; font-family:'Segoe UI',Arial,sans-serif; }
        header { background:#111; padding:25px; text-align:center; border-bottom:5px solid #0f0; }
        h1 { color:#0f0; font-size:2.5em; margin:0; }
        .subtitle { color:#aaa; margin-top:8px; }
        .container { max-width:1000px; margin:0 auto; padding:20px; }
        .article { background:#1a1a1a; margin-bottom:25px; border-radius:12px; overflow:hidden; border:1px solid #333; }
        .article img { width:100%; height:230px; object-fit:cover; }
        .content { padding:20px; }
        .title { font-size:1.4em; margin-bottom:12px; color:#0f0; line-height:1.3; }
        .summary { color:#ccc; line-height:1.6; margin-bottom:15px; }
        .read-more { color:#0f0; text-decoration:none; font-weight:bold; }
        .coffee { position:fixed; bottom:25px; right:25px; background:#FFDD00; color:#000; padding:15px 25px; border-radius:50px; text-decoration:none; font-weight:bold; box-shadow:0 5px 15px rgba(0,0,0,0.5); z-index:100; }
    </style>
</head>
<body>
    <header>
        <h1>📰 AiS Daily News</h1>
        <p class="subtitle">Fresh headlines from around the world • New content on every refresh</p>
    </header>

    <div class="container" id="news-container"></div>

    <a href="https://www.buymeacoffee.com/ais123" target="_blank" class="coffee">☕ Support AiS</a>

    <script>
        const articles = [
            {
                title: "David Sullivan banned from contact with West Ham women's and youth teams since 2023",
                summary: "The decision followed a safeguarding investigation opened by the Football Association.",
                link: "https://www.bbc.com/sport",
                img: "https://picsum.photos/id/1015/800/400"
            },
            {
                title: "Trump says Iran shot down US helicopter and vows to respond",
                summary: "Two crew members of the Apache helicopter that crashed were rescued by an American sea drone.",
                link: "https://www.reuters.com",
                img: "https://picsum.photos/id/1016/800/400"
            },
            {
                title: "Global markets react to latest economic developments",
                summary: "Major indices showed mixed performance as investors weigh new policy announcements.",
                link: "https://www.nytimes.com",
                img: "https://picsum.photos/id/1074/800/400"
            },
            {
                title: "NASA announces major breakthrough in space exploration",
                summary: "New mission aims to study Earth's climate and extreme weather patterns in detail.",
                link: "https://www.nasa.gov",
                img: "https://picsum.photos/id/133/800/400"
            }
        ];

        function loadArticles() {
            const container = document.getElementById('news-container');
            let html = '';

            // Shuffle articles and add random image parameter to make it feel fresh
            const shuffled = articles.sort(() => Math.random() - 0.5);
            
            shuffled.forEach((article, i) => {
                const randomImg = `\( {article.img}?random= \){Date.now() + i}`;
                html += `
                    <div class="article">
                        <img src="\( {randomImg}" alt=" \){article.title}">
                        <div class="content">
                            <h2 class="title">${article.title}</h2>
                            <p class="summary">${article.summary}</p>
                            <a href="${article.link}" target="_blank" class="read-more">Read Full Article →</a>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
        }

        loadArticles();
    </script>
</body>
</html>
