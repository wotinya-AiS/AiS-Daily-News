<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiS Daily News</title>
    <style>
        body { margin:0; padding:0; background:#0f0f0f; color:#eee; font-family:'Segoe UI',Arial,sans-serif; }
        header { background:#111; padding:25px; text-align:center; border-bottom:5px solid #0f0; }
        h1 { color:#0f0; font-size:2.5em; margin:0; }
        .subtitle { color:#aaa; margin-top:8px; }
        .tabs { display:flex; background:#1a1a1a; margin:0 20px; border-radius:8px; overflow:hidden; }
        .tab { padding:12px 20px; flex:1; text-align:center; cursor:pointer; }
        .tab.active { background:#0f0; color:#000; font-weight:bold; }
        .container { max-width:1000px; margin:0 auto; padding:20px; }
        .article { background:#1a1a1a; margin-bottom:25px; border-radius:12px; overflow:hidden; border:1px solid #333; }
        .article img { width:100%; height:220px; object-fit:cover; }
        .content { padding:20px; }
        .title { font-size:1.35em; margin-bottom:12px; color:#0f0; line-height:1.3; }
        .summary { color:#ccc; line-height:1.6; margin-bottom:15px; }
        .read-more { color:#0f0; text-decoration:none; font-weight:bold; }
        .coffee { position:fixed; bottom:25px; right:25px; background:#FFDD00; color:#000; padding:15px 25px; border-radius:50px; text-decoration:none; font-weight:bold; box-shadow:0 5px 15px rgba(0,0,0,0.5); z-index:100; }
    </style>
</head>
<body>
    <header>
        <h1>📰 AiS Daily News</h1>
        <p class="subtitle">Fresh headlines from around the world • New mix on every refresh</p>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="filterCategory('all')">All</div>
        <div class="tab" onclick="filterCategory('world')">World</div>
        <div class="tab" onclick="filterCategory('tech')">Tech</div>
        <div class="tab" onclick="filterCategory('sports')">Sports</div>
    </div>

    <div class="container" id="news-container"></div>

    <a href="https://www.buymeacoffee.com/ais123" target="_blank" class="coffee">☕ Support AiS</a>

    <script>
        const articles = [
            { category: "sports", title: "David Sullivan banned from contact with West Ham women's and youth teams since 2023", summary: "The decision followed a safeguarding investigation by the Football Association.", link: "https://www.bbc.com/sport", img: "https://picsum.photos/id/1015/800/400" },
            { category: "world", title: "Trump says Iran shot down US helicopter and vows to respond", summary: "Two crew members were rescued following the incident.", link: "https://www.reuters.com", img: "https://picsum.photos/id/1016/800/400" },
            { category: "tech", title: "AI breakthrough could revolutionize medical diagnostics", summary: "New system shows unprecedented accuracy in detecting diseases.", link: "https://techcrunch.com", img: "https://picsum.photos/id/180/800/400" },
            { category: "world", title: "Global markets react to latest economic developments", summary: "Major indices showed mixed performance as investors weigh new policies.", link: "https://www.nytimes.com", img: "https://picsum.photos/id/1074/800/400" },
            { category: "tech", title: "New electric vehicle battery promises 500 mile range", summary: "The breakthrough could accelerate the transition to sustainable transport.", link: "https://techcrunch.com", img: "https://picsum.photos/id/107/800/400" },
            { category: "sports", title: "World Cup qualifiers deliver shocking upsets", summary: "Underdog teams continue to surprise established football powers.", link: "https://www.bbc.com/sport", img: "https://picsum.photos/id/1015/800/400" },
            { category: "world", title: "Scientists discover new species in the Amazon rainforest", summary: "The discovery could have significant implications for biodiversity.", link: "https://www.nationalgeographic.com", img: "https://picsum.photos/id/201/800/400" },
            { category: "tech", title: "NASA announces major breakthrough in space exploration", summary: "New mission aims to study Earth's climate in detail.", link: "https://www.nasa.gov", img: "https://picsum.photos/id/133/800/400" }
        ];

        function loadArticles(filteredArticles = articles) {
            const container = document.getElementById('news-container');
            let html = '';

            filteredArticles.forEach(article => {
                html += `
                    <div class="article">
                        <img src="\( {article.img}" alt=" \){article.title}">
                        <div class="content">
                            <h2 class="title">${article.title}</h2>
                            <p class="summary">${article.summary}</p>
                            <a href="${article.link}" target="_blank" class="read-more">Read Full Article →</a>
                        </div>
                    </div>`;
            });

            container.innerHTML = html || '<p style="text-align:center; padding:40px;">No articles found in this category.</p>';
        }

        function filterCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (cat === 'all') {
                document.querySelector('.tab').classList.add('active');
                loadArticles(articles);
            } else {
                const activeTab = Array.from(document.querySelectorAll('.tab')).find(t => t.textContent.toLowerCase() === cat);
                if (activeTab) activeTab.classList.add('active');
                const filtered = articles.filter(a => a.category === cat);
                loadArticles(filtered);
            }
        }

        // Initial load
        loadArticles();
    </script>
</body>
</html>
