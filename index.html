<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
        }
        canvas {
            border: 4px solid #0f0;
            image-rendering: pixelated;
            background: #000;
            max-width: 100%;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        button:hover { background: #0c0; }
        .coffee-btn {
            background: #FFDD00;
            color: #000;
            font-size: 18px;
            padding: 12px 20px;
            margin-top: 10px;
        }
        .info {
            margin: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🐍 Snake Game</h1>
    <div class="info">
        <span id="score">Score: 0</span> | 
        <span id="highscore">High: 0</span>
    </div>
    <canvas id="game" width="640" height="480"></canvas>
    
    <div class="controls">
        <button onclick="setDifficulty(8)">Easy</button>
        <button onclick="setDifficulty(12)">Medium</button>
        <button onclick="setDifficulty(18)">Hard</button>
        <button onclick="setDifficulty(25)">Insane</button>
        <button onclick="togglePause()">Pause</button>
        <button onclick="resetGame()">Restart</button>
    </div>

    <a href="https://buymeacoffee.com/" target="_blank">
        <button class="coffee-btn">☕ Buy Me a Coffee</button>
    </a>

    <div class="info" style="margin-top:10px;">
        <small>Use arrow keys or swipe • Eat red food • Don't hit yourself</small>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');

        const GRID = 20;
        const WIDTH = canvas.width / GRID;
        const HEIGHT = canvas.height / GRID;

        let snake, food, dx, dy, score, highScore, gameInterval, speed = 12, paused = false;

        function initGame() {
            snake = [{x: 10, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            placeFood();
            updateScore();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 1000 / speed);
        }

        function placeFood() {
            food = { x: Math.floor(Math.random() * WIDTH), y: Math.floor(Math.random() * HEIGHT) };
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) return placeFood();
            }
        }

        function updateScore() {
            scoreEl.textContent = `Score: ${score}`;
            const saved = localStorage.getItem('snakeHighScore') || 0;
            highScore = Math.max(score, parseInt(saved));
            highscoreEl.textContent = `High: ${highScore}`;
            localStorage.setItem('snakeHighScore', highScore);
        }

        function gameLoop() {
            if (paused) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            head.x = (head.x + WIDTH) % WIDTH;
            head.y = (head.y + HEIGHT) % HEIGHT;

            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#222';
            for (let i = 0; i <= WIDTH; i++) {
                ctx.beginPath(); ctx.moveTo(i*GRID, 0); ctx.lineTo(i*GRID, canvas.height); ctx.stroke();
            }
            for (let i = 0; i <= HEIGHT; i++) {
                ctx.beginPath(); ctx.moveTo(0, i*GRID); ctx.lineTo(canvas.width, i*GRID); ctx.stroke();
            }

            ctx.fillStyle = '#0f0';
            snake.forEach((segment, i) => {
                ctx.fillRect(segment.x * GRID + 1, segment.y * GRID + 1, GRID - 2, GRID - 2);
                if (i === 0) {
                    ctx.fillStyle = '#0f8';
                    ctx.fillRect(segment.x * GRID + 4, segment.y * GRID + 4, GRID - 8, GRID - 8);
                    ctx.fillStyle = '#0f0';
                }
            });

            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x * GRID + 3, food.y * GRID + 3, GRID - 6, GRID - 6);
        }

        function gameOver() {
            clearInterval(gameInterval);
            alert(`Game Over! Score: ${score}\nHigh Score: ${highScore}\n\nPress OK to restart`);
            resetGame();
        }

        function resetGame() {
            paused = false;
            initGame();
        }

        function setDifficulty(newSpeed) {
            speed = newSpeed;
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, 1000 / speed);
            }
        }

        function togglePause() {
            paused = !paused;
        }

        document.addEventListener('keydown', e => {
            if (paused) return;
            switch(e.key) {
                case 'ArrowUp': if (dy !== 1) {dx=0; dy=-1;} break;
                case 'ArrowDown': if (dy !== -1) {dx=0; dy=1;} break;
                case 'ArrowLeft': if (dx !== 1) {dx=-1; dy=0;} break;
                case 'ArrowRight': if (dx !== -1) {dx=1; dy=0;} break;
                case 'p': case 'P': togglePause(); break;
                case 'r': case 'R': resetGame(); break;
            }
        });

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });
        canvas.addEventListener('touchend', e => {
            if (paused) return;
            const diffX = e.changedTouches[0].screenX - touchStartX;
            const diffY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && dx !== -1) { dx = 1; dy = 0; }
                else if (diffX < -30 && dx !== 1) { dx = -1; dy = 0; }
            } else {
                if (diffY > 30 && dy !== -1) { dx = 0; dy = 1; }
                else if (diffY < -30 && dy !== 1) { dx = 0; dy = -1; }
            }
        });

        initGame();
    </script>
</body>
</html>
